<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><g id="background"><rect width="1280" height="720" fill="#F3F5F3"/></g><g id="header"><text x="64" y="84" font-family="Arial Black, Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="38" font-weight="bold" fill="#19211F">说进去：麦克风 → 千问 ASR → Codex</text></g><g id="pipeline"><g id="mic"><circle cx="194" cy="300" r="84" fill="#2D7D9A"/><use data-icon="phosphor-duotone/microphone" x="154" y="260" width="80" height="80" fill="#F3F5F3"/><text x="194" y="424" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" fill="#19211F">键盘录音</text><text x="194" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#5D6864">16 kHz PCM</text></g><g id="wifi"><line x1="278" y1="300" x2="452" y2="300" stroke="#2D7D9A" stroke-width="6"/><polygon points="452,286 480,300 452,314" fill="#2D7D9A"/><use data-icon="phosphor-duotone/wifi-high" x="342" y="246" width="44" height="44" fill="#2D7D9A"/></g><g id="asr"><rect x="500" y="216" width="280" height="168" rx="8" fill="#FFFFFF" stroke="#CBD2CE" stroke-width="2"/><text x="640" y="282" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="28" font-weight="bold" fill="#19211F">语音转文字</text><text x="640" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#2D7D9A">Qwen Audio ASR</text><text x="640" y="356" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="15" fill="#5D6864">DashScope 北京区</text></g><g id="codex"><line x1="780" y1="300" x2="954" y2="300" stroke="#1E9668" stroke-width="6"/><polygon points="954,286 982,300 954,314" fill="#1E9668"/><circle cx="1082" cy="300" r="84" fill="#19211F"/><use data-icon="phosphor-duotone/code" x="1042" y="260" width="80" height="80" fill="#F3F5F3"/><text x="1082" y="424" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#19211F">Codex task</text><text x="1082" y="458" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="15" fill="#5D6864">排队进入绑定任务</text></g></g><g id="caption"><rect x="238" y="540" width="804" height="64" rx="8" fill="#19211F"/><text x="640" y="581" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="20" fill="#F3F5F3">键盘不理解内容。它只负责把声音可靠地送到 Mac。</text></g><g id="footer"><text x="64" y="674" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="12" fill="#5D6864">23 / 40</text></g></svg>
