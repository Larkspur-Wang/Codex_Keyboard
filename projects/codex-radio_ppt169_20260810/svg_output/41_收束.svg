<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <g id="background">
    <rect width="1280" height="720" fill="#19211F"/>
  </g>
  <g id="icon">
    <image href="../images/codex-keyboard-app-icon.png" x="104" y="204" width="280" height="280" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g id="statement">
    <text x="474" y="206" font-family="Arial Black, Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="50" font-weight="bold" fill="#F3F5F3">
      <tspan x="474" dy="0">从一个任务开始，</tspan>
      <tspan x="474" dy="68">把说和听都跑通。</tspan>
    </text>
    <text x="474" y="384" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="28" font-weight="bold" fill="#F3F5F3">
      <tspan x="474" dy="0">下一步，再选一件你常做的事来改。</tspan>
    </text>
    <text x="474" y="466" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="20" fill="#CBD2CE">
      <tspan x="474" dy="0">留下代码版本、操作步骤和实际结果。</tspan>
      <tspan x="474" dy="38">遇到问题，就从出错的那一段查起。</tspan>
    </text>
  </g>
  <g id="closing">
    <rect x="474" y="566" width="604" height="4" fill="#1E9668"/>
    <text x="474" y="620" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="22" fill="#F3F5F3">Codex 任务电台 · Lark</text>
  </g>
  <g id="footer">
    <text x="64" y="674" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="12" fill="#CBD2CE">41 / 47</text>
  </g>
</svg>
