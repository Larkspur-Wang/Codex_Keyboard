<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><g id="background"><rect width="1280" height="720" fill="#F3F5F3"/></g><g id="statement"><text x="88" y="150" font-family="Arial Black, Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="50" font-weight="bold" fill="#19211F">真正播完，才算“听过”</text><text x="88" y="210" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="22" fill="#5D6864">把包传完，不代表声音已经从扬声器出来。</text></g><g id="not-enough"><rect x="88" y="294" width="470" height="220" rx="8" fill="#FFFFFF" stroke="#D65C4A" stroke-width="3"/><use data-icon="phosphor-duotone/warning-circle" x="124" y="334" width="56" height="56" fill="#D65C4A"/><text x="204" y="370" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="28" font-weight="bold" fill="#D65C4A">不能在这里熄灯</text><text x="124" y="438" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="20" fill="#5D6864"><tspan x="124" dy="0">音频传输完成</tspan><tspan x="124" dy="36">扬声器可能还在播放</tspan></text></g><g id="correct"><rect x="722" y="294" width="470" height="220" rx="8" fill="#19211F"/><use data-icon="phosphor-duotone/check-circle" x="758" y="334" width="56" height="56" fill="#1E9668"/><text x="838" y="370" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="28" font-weight="bold" fill="#F3F5F3">在这里才删除缓存</text><text x="758" y="438" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="20" fill="#CBD2CE"><tspan x="758" dy="0">扬声器确认播放结束</tspan><tspan x="758" dy="36">灯熄灭，音频删除</tspan></text></g><g id="arrow"><line x1="558" y1="404" x2="694" y2="404" stroke="#1E9668" stroke-width="6"/><polygon points="694,390 722,404 694,418" fill="#1E9668"/></g><g id="footer"><text x="64" y="674" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="12" fill="#5D6864">24 / 36</text></g></svg>
