<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<g id="background"><rect width="1280" height="720" fill="#F3F5F3"/></g>
<g id="definition"><text x="100" y="196" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="50" font-weight="bold" fill="#19211F"><tspan x="100" dy="0">把四个 Codex 任务，</tspan><tspan x="100" dy="76">变成四个<tspan fill="#1E9668">可说、可听、会亮灯</tspan>的实体频道。</tspan></text></g>
<g id="channels"><line x1="102" y1="430" x2="1178" y2="430" stroke="#CBD2CE" stroke-width="2"/><g id="channel-1"><circle cx="180" cy="430" r="26" fill="#1E9668"/><text x="180" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">1</text></g><g id="channel-2"><circle cx="486" cy="430" r="26" fill="#2D7D9A"/><text x="486" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">2</text></g><g id="channel-3"><circle cx="792" cy="430" r="26" fill="#1E9668"/><text x="792" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">3</text></g><g id="channel-4"><circle cx="1098" cy="430" r="26" fill="#2D7D9A"/><text x="1098" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">4</text></g></g>
<g id="caption"><text x="100" y="554" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="28" fill="#5D6864">不是多做一个屏幕，而是少看一点屏幕。</text></g>
<g id="footer"><text x="64" y="674" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="12" fill="#5D6864">04 / 36</text></g>
</svg>
