<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><g id="background"><rect width="1280" height="720" fill="#19211F" /></g><g id="header"><text x="64" y="92" font-family="Arial Black, Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="38" font-weight="bold" fill="#F3F5F3">前四颗看信箱，第五颗看忙不忙</text><text x="64" y="130" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="18" fill="#CBD2CE">左起 1-4 对应四个槽；最右灯用颜色表示正在运行的任务数。</text></g><g id="lightbar"><path fill="#F3F5F3" d="M124,190 H1156 A8,8 0 0 1 1164,198 V420 A8,8 0 0 1 1156,428 H124 A8,8 0 0 1 116,420 V198 A8,8 0 0 1 124,190 Z" /><g id="slot1"><circle cx="254" cy="294" r="48" fill="#1E9668" fill-opacity="0.35" /><text x="254" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#19211F">SLOT 1</text></g><g id="slot2"><circle cx="448" cy="294" r="48" fill="#1E9668" fill-opacity="0.62" /><text x="448" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#19211F">SLOT 2</text></g><g id="slot3"><circle cx="642" cy="294" r="48" fill="#1E9668" fill-opacity="0.88" /><text x="642" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#19211F">SLOT 3</text></g><g id="slot4"><circle cx="836" cy="294" r="48" fill="#1E9668" /><text x="836" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#19211F">SLOT 4</text></g><line x1="936" y1="220" x2="936" y2="398" stroke="#CBD2CE" stroke-width="2" /><g id="activity"><circle cx="1030" cy="294" r="48" fill="#7A4DB3" /><text x="1030" y="390" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#19211F">3 个运行</text></g></g><g id="mailbox-scale"><text x="116" y="490" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="18" fill="#CBD2CE">信箱灯</text><text x="196" y="490" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="18" fill="#CBD2CE">未听越多</text><line x1="306" y1="483" x2="522" y2="483" stroke="#1E9668" stroke-width="8" /><polygon points="522,469 550,483 522,497" fill="#1E9668" /></g><g id="activity-scale"><text x="116" y="558" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="18" fill="#CBD2CE">第 5 灯</text><g id="a0"><circle cx="254" cy="552" r="18" fill="#1E9668" /><text x="254" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#F3F5F3">0</text></g><g id="a1"><circle cx="374" cy="552" r="18" fill="#E0A636" /><text x="374" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#F3F5F3">1</text></g><g id="a2"><circle cx="494" cy="552" r="18" fill="#D9822B" /><text x="494" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#F3F5F3">2</text></g><g id="a3"><circle cx="614" cy="552" r="18" fill="#7A4DB3" /><text x="614" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#F3F5F3">3</text></g><g id="a4"><circle cx="734" cy="552" r="18" fill="#D65C4A" /><text x="734" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#F3F5F3">4</text></g><text x="800" y="560" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="18" fill="#F3F5F3">绿 / 黄 / 橙 / 紫 / 红</text><text x="800" y="590" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="15" fill="#CBD2CE">全部完成后回到绿色</text></g><g id="footer"><text x="64" y="674" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="12" fill="#CBD2CE">19 / 40</text></g></svg>