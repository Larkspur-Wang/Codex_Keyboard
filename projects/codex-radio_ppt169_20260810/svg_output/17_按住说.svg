<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><g id="background"><rect width="1280" height="720" fill="#F3F5F3"/></g><g id="header"><text x="64" y="84" font-family="Arial Black, Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="38" font-weight="bold" fill="#19211F">按住说，松开就发</text></g><g id="step-press"><circle cx="220" cy="300" r="92" fill="#2D7D9A"/><use data-icon="phosphor-duotone/keyboard" x="176" y="256" width="88" height="88" fill="#F3F5F3"/><text x="220" y="444" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="28" font-weight="bold" fill="#19211F">按住 S1-S4</text><text x="220" y="482" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="18" fill="#5D6864">选中对应任务</text></g><g id="step-talk"><line x1="312" y1="300" x2="500" y2="300" stroke="#CBD2CE" stroke-width="5"/><polygon points="500,288 524,300 500,312" fill="#CBD2CE"/><circle cx="640" cy="300" r="92" fill="#19211F"/><use data-icon="phosphor-duotone/microphone" x="596" y="256" width="88" height="88" fill="#F3F5F3"/><text x="640" y="444" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="28" font-weight="bold" fill="#19211F">直接说要求</text><text x="640" y="482" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="18" fill="#5D6864">录音留在本地链路</text></g><g id="step-release"><line x1="732" y1="300" x2="920" y2="300" stroke="#CBD2CE" stroke-width="5"/><polygon points="920,288 944,300 920,312" fill="#CBD2CE"/><circle cx="1060" cy="300" r="92" fill="#1E9668"/><use data-icon="phosphor-duotone/arrow-right" x="1016" y="256" width="88" height="88" fill="#F3F5F3"/><text x="1060" y="444" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="28" font-weight="bold" fill="#19211F">松开后发送</text><text x="1060" y="482" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="18" fill="#5D6864">ASR 结果进入 Codex</text></g><g id="footer"><text x="64" y="674" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="12" fill="#5D6864">17 / 40</text></g></svg>
