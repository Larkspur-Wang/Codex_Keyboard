<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><g id="background"><image href="../images/idea-eight-key-board.png" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice"/></g><g id="text-panel"><rect x="0" y="0" width="580" height="720" fill="#F3F5F3" fill-opacity="0.94"/><text x="64" y="142" font-family="Arial Black, Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="50" font-weight="bold" fill="#19211F"><tspan x="64" dy="0">手边正好有一块</tspan><tspan x="64" dy="66">八键开发板</tspan></text><text x="64" y="328" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="22" fill="#5D6864"><tspan x="64" dy="0">八个键、五颗灯、麦克风、</tspan><tspan x="64" dy="38">Wi-Fi，还有扬声器链路。</tspan></text><line x1="64" y1="442" x2="486" y2="442" stroke="#CBD2CE" stroke-width="2"/><text x="64" y="504" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="28" font-weight="bold" fill="#1E9668">不如把它改成任务对讲机。</text></g><g id="footer"><text x="64" y="674" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="12" fill="#5D6864">08 / 36</text></g></svg>
