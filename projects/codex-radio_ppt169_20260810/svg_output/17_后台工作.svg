<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><g id="background"><rect width="1280" height="720" fill="#F3F5F3"/></g><g id="statement"><text x="92" y="176" font-family="Arial Black, Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="50" font-weight="bold" fill="#19211F">发完就走。</text><text x="92" y="248" font-family="Arial Black, Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="50" font-weight="bold" fill="#1E9668">Codex 在后台干活。</text><text x="92" y="324" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="22" fill="#5D6864">这才是我真正想省下来的时间：不用守着屏幕。</text></g><g id="handoff"><use data-icon="phosphor-duotone/keyboard" x="156" y="430" width="96" height="96" fill="#2D7D9A"/><line x1="292" y1="478" x2="792" y2="478" stroke="#CBD2CE" stroke-width="6"/><polygon points="792,462 824,478 792,494" fill="#CBD2CE"/><use data-icon="phosphor-duotone/code" x="872" y="430" width="96" height="96" fill="#1E9668"/><text x="204" y="570" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="18" fill="#5D6864">一句要求</text><text x="920" y="570" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="18" fill="#5D6864">一段完整工作</text></g><g id="footer"><text x="64" y="674" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="12" fill="#5D6864">17 / 36</text></g></svg>
