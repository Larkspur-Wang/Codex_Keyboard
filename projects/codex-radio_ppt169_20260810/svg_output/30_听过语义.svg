<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F3F5F3"/>
  <g id="content" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" fill="#19211F">
    <text x="64" y="54" font-size="15" fill="#1E9668">原理 9 / 10 · 播放与已听</text>
    <text x="64" y="108" font-size="38" font-weight="bold">先播起来，播完确认后再清理缓存</text>
    <text x="64" y="152" font-size="22" fill="#5D6864">整段分配 PSRAM，不等于整段收完才播。当前已经使用预缓冲播放。</text>
    <text x="64" y="262" font-size="24" font-weight="bold">接收数据</text>
    <rect x="266" y="231" width="183" height="52" fill="#2D7D9A"/>
    <rect x="449" y="231" width="514" height="52" fill="#CBD2CE"/>
    <text x="274" y="321" font-size="22" fill="#2D7D9A">达到 24 KiB</text>
    <text x="532" y="265" font-size="22">继续接收剩余部分</text>
    <text x="64" y="400" font-size="24" font-weight="bold">扬声器播放</text>
    <rect x="449" y="369" width="660" height="52" fill="#1E9668"/>
    <text x="681" y="403" font-size="22" fill="#FFFFFF">边收边解码播放</text>
    <path d="M449 290 V441 M1109 431 V476" stroke="#5D6864" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="832" y="513" font-size="22" font-weight="bold">播放完成 + 匹配身份的回执</text>
    <text x="832" y="552" font-size="22">Host 才标记本条已听</text>
    <text x="64" y="514" font-size="22">短于预缓冲的音频，收完后播放。</text>
    <text x="64" y="553" font-size="22">慢网仍可能等待或失败，不能保证不断音。</text>
    <path d="M64 588 H1216" stroke="#CBD2CE" stroke-width="2"/>
    <text x="64" y="628" font-size="22" fill="#5D6864">PTT 抢占或断电时保留未读。拔电后物理灯会灭，重连后再同步仍未听的信箱状态。</text>
    <text x="64" y="690" font-size="12" fill="#5D6864">30 / 47 · 时间条为流程示意，不代表实际延迟</text>
  </g>
