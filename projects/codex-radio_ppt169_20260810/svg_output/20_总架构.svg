<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><g id="background"><rect width="1280" height="720" fill="#19211F"/></g><g id="header"><text x="64" y="100" font-family="Arial Black, Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="50" font-weight="bold" fill="#F3F5F3">三个角色，分工很简单</text></g><g id="keyboard-body"><circle cx="230" cy="340" r="116" fill="#2D7D9A"/><use data-icon="phosphor-duotone/keyboard" x="178" y="288" width="104" height="104" fill="#F3F5F3"/><text x="230" y="502" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="28" font-weight="bold" fill="#F3F5F3">键盘是身体</text><text x="230" y="540" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="18" fill="#CBD2CE">收声音、亮灯、播声音</text></g><g id="mac-housekeeper"><line x1="346" y1="340" x2="500" y2="340" stroke="#CBD2CE" stroke-width="6"/><polygon points="500,326 528,340 500,354" fill="#CBD2CE"/><circle cx="640" cy="340" r="116" fill="#1E9668"/><use data-icon="phosphor-duotone/desktop" x="588" y="288" width="104" height="104" fill="#F3F5F3"/><text x="640" y="502" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="28" font-weight="bold" fill="#F3F5F3">Mac 是管家</text><text x="640" y="540" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="18" fill="#CBD2CE">绑定、监控、总结、缓存</text></g><g id="codex-executor"><line x1="756" y1="340" x2="910" y2="340" stroke="#CBD2CE" stroke-width="6"/><polygon points="910,326 938,340 910,354" fill="#CBD2CE"/><circle cx="1050" cy="340" r="116" fill="#F3F5F3"/><use data-icon="phosphor-duotone/code" x="998" y="288" width="104" height="104" fill="#19211F"/><text x="1050" y="502" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="28" font-weight="bold" fill="#F3F5F3">Codex 是执行者</text><text x="1050" y="540" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="18" fill="#CBD2CE">真正写代码、跑测试</text></g><g id="footer"><text x="64" y="674" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="12" fill="#CBD2CE">20 / 36</text></g></svg>
