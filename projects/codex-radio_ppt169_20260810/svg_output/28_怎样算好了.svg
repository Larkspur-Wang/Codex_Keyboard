<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><g id="background"><rect width="1280" height="720" fill="#F3F5F3"/></g><g id="statement"><text x="88" y="144" font-family="Arial Black, Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="50" font-weight="bold" fill="#19211F">测试通过，不等于耳朵真的听到了</text></g><g id="ladder"><rect x="110" y="490" width="220" height="80" fill="#CBD2CE"/><text x="220" y="540" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#19211F">代码与静态检查</text><rect x="330" y="410" width="220" height="160" fill="#2D7D9A"/><text x="440" y="500" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#F3F5F3">自动化测试</text><rect x="550" y="330" width="220" height="240" fill="#E0A636"/><text x="660" y="460" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#19211F">运行时与网络</text><rect x="770" y="250" width="390" height="320" fill="#1E9668"/><use data-icon="phosphor-duotone/speaker-high" x="930" y="314" width="70" height="70" fill="#F3F5F3"/><text x="965" y="438" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="28" font-weight="bold" fill="#F3F5F3">真机可听</text><text x="965" y="482" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="18" fill="#F3F5F3">按键、亮灯、播放、熄灯</text></g><g id="caption"><text x="88" y="640" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="22" fill="#D65C4A">最后一级，只能靠真实设备和人的耳朵验收。</text></g><g id="footer"><text x="64" y="686" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="12" fill="#5D6864">28 / 36</text></g></svg>
