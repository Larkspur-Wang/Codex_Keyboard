<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<g id="background"><rect width="1280" height="720" fill="#19211F"/></g>
<g id="header"><text x="64" y="98" font-family="Arial Black, Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="38" font-weight="bold" fill="#F3F5F3">20 秒看懂它</text><text x="64" y="136" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="18" fill="#CBD2CE">真实演示只有四个动作。</text></g>
<g id="step-talk"><use data-icon="phosphor-duotone/microphone" x="112" y="250" width="72" height="72" fill="#2D7D9A"/><text x="100" y="382" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="50" font-weight="bold" fill="#F3F5F3">说</text><text x="100" y="424" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="18" fill="#CBD2CE">按住上排键</text></g>
<g id="step-work"><line x1="246" y1="306" x2="350" y2="306" stroke="#5D6864" stroke-width="4"/><polygon points="350,294 374,306 350,318" fill="#5D6864"/><use data-icon="phosphor-duotone/code" x="410" y="250" width="72" height="72" fill="#1E9668"/><text x="398" y="382" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="50" font-weight="bold" fill="#F3F5F3">做</text><text x="398" y="424" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="18" fill="#CBD2CE">Codex 在后台</text></g>
<g id="step-light"><line x1="544" y1="306" x2="648" y2="306" stroke="#5D6864" stroke-width="4"/><polygon points="648,294 672,306 648,318" fill="#5D6864"/><use data-icon="phosphor-duotone/lightbulb" x="708" y="250" width="72" height="72" fill="#E0A636"/><text x="696" y="382" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="50" font-weight="bold" fill="#F3F5F3">亮</text><text x="696" y="424" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="18" fill="#CBD2CE">有新汇报</text></g>
<g id="step-listen"><line x1="842" y1="306" x2="946" y2="306" stroke="#5D6864" stroke-width="4"/><polygon points="946,294 970,306 946,318" fill="#5D6864"/><use data-icon="phosphor-duotone/speaker-high" x="1006" y="250" width="72" height="72" fill="#1E9668"/><text x="994" y="382" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="50" font-weight="bold" fill="#F3F5F3">听</text><text x="994" y="424" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="18" fill="#CBD2CE">按一下下排键</text></g>
<g id="footer"><text x="64" y="674" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="12" fill="#CBD2CE">03 / 40</text></g>
</svg>
