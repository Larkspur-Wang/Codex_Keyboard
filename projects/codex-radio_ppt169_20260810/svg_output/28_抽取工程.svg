<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><g id="background"><rect width="1280" height="720" fill="#F3F5F3"/></g><g id="header"><text x="64" y="84" font-family="Arial Black, Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="38" font-weight="bold" fill="#19211F">从现有键盘，抽出自己的 App 和固件</text></g><g id="source"><rect x="64" y="172" width="322" height="364" rx="8" fill="#FFFFFF" stroke="#CBD2CE" stroke-width="2"/><use data-icon="phosphor-duotone/keyboard" x="98" y="212" width="56" height="56" fill="#2D7D9A"/><text x="98" y="316" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#19211F">easy-input-keyboard</text><text x="98" y="368" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="18" fill="#5D6864"><tspan x="98" dy="0">成熟的硬件基线</tspan><tspan x="98" dy="36">BLE、USB、按键、音频</tspan><tspan x="98" dy="36">继续保持原仓库不动</tspan></text></g><g id="extract"><line x1="386" y1="354" x2="530" y2="354" stroke="#1E9668" stroke-width="6"/><polygon points="530,340 558,354 530,368" fill="#1E9668"/><text x="472" y="326" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="15" fill="#5D6864">抽取本地 Wi-Fi 版本</text></g><g id="target"><rect x="558" y="172" width="658" height="364" rx="8" fill="#19211F"/><text x="598" y="230" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#F3F5F3">Codex_Keyboard</text><g id="firmware"><rect x="598" y="282" width="264" height="180" rx="8" fill="#2D7D9A"/><use data-icon="phosphor-duotone/code" x="626" y="310" width="48" height="48" fill="#F3F5F3"/><text x="626" y="398" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#F3F5F3">firmware/</text><text x="626" y="432" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="15" fill="#F3F5F3">ESP-IDF 设备端</text></g><g id="app"><rect x="912" y="282" width="264" height="180" rx="8" fill="#1E9668"/><use data