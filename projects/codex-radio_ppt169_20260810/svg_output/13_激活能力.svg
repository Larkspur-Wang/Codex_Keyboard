  </g>
  <g id="header">
    <text x="64" y="92" font-family="Arial Black, Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="38" font-weight="bold" fill="#F3F5F3">音频链路用到了这些硬件</text>
  </g>
  <g id="images">
    <image href="../images/easyinput-v2-pcb-front.png" x="64" y="138" width="550" height="310" preserveAspectRatio="xMidYMid meet"/>
    <image href="../images/easyinput-v2-pcb-back.png" x="666" y="138" width="550" height="310" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g id="capabilities">
    <text x="100" y="544" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="28" font-weight="bold" fill="#F3F5F3">PSRAM</text>
    <text x="362" y="544" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="28" font-weight="bold" fill="#F3F5F3">Wi-Fi 音频</text>
