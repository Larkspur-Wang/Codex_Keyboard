<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><g id="background"><rect width="1280" height="720" fill="#F3F5F3"/></g><g id="header"><text x="64" y="82" font-family="Arial Black, Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="38" font-weight="bold" fill="#19211F">声音怎么变成数字</text><text x="64" y="122" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="22" fill="#5D6864">给声音拍连拍照片：每秒拍 16000 张，每张记 16 位，播放就是按原速连放。</text></g>
<g id="uplink"><rect x="64" y="160" width="1152" height="180" rx="12" fill="#FFFFFF" stroke="#CBD2CE" stroke-width="2"/><text x="92" y="204" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" fill="#2D7D9A">上行 · 你说话</text><use data-icon="phosphor-duotone/microphone" x="132" y="236" width="52" height="52" fill="#2D7D9A"/><text x="158" y="322" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="15" fill="#19211F">麦克风收声波</text><line x1="220" y1="262" x2="330" y2="262" stroke="#2D7D9A" stroke-width="4"/><use data-icon="phosphor-duotone/timer" x="360" y="236" width="52" height="52" fill="#2D7D9A"/><text x="386" y="322" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="15" fill="#19211F">每秒采样 16000 次</text><line x1="448" y1="262" x2="558" y2="262" stroke="#2D7D9A" stroke-width="4"/><use data-icon="phosphor-duotone/brackets-angle" x="588" y="236" width="52" height="52" fill="#2D7D9A"/><text x="614" y="322" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="15" fill="#19211F">16 位一个点 · PCM16</text><line x1="676" y1="262" x2="786" y2="262" stroke="#2D7D9A" stroke-width="4"/><use data-icon="phosphor-duotone/wifi-high" x="816" y="236" width="52" height="52" fill="#2D7D9A"/><text x="842" y="322" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="15" fill="#19211F">边说边加密上行</text><line x1="904" y1="262" x2="1014" y2="262" stroke="#2D7D9A" stroke-width="4"/><use data-icon="phosphor-duotone/desktop" x="1044" y="236" width="52" height="52" fill="#19211F"/><text x="1070" y="322" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="15" fill="#19211F">Mac 转文字</text></g>
<g id="downlink"><rect x="64" y="368" width="1152" height="180" rx="12" fill="#FFFFFF" stroke="#CBD2CE" stroke-width="2"/><text x="92" y="412" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" fill="#1E9668">下行 · 总结播报</text><use data-icon="phosphor-duotone/cloud-arrow-up" x="132" y="444" width="52" height="52" fill="#1E9668"/><text x="158" y="530" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="15" fill="#19211F">TTS 合成 48 kHz</text><line x1="220" y1="470" x2="330" y2="470" stroke="#1E9668" stroke-width="4"/><use data-icon="phosphor-duotone/database" x="360" y="444" width="52" height="52" fill="#1E9668"/><text x="386" y="530" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="15" fill="#19211F">转码 ADPCM · 体积 1/4</text><line x1="448" y1="470" x2="558" y2="470" stroke="#1E9668" stroke-width="4"/><use data-icon="phosphor-duotone/lock-key" x="588" y="444" width="52" height="52" fill="#1E9668"/><text x="614" y="530" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="15" fill="#19211F">加密缓存等你按键</text><line x1="676" y1="470" x2="786" y2="470" stroke="#1E9668" stroke-width="4"/><use data-icon="phosphor-duotone/wifi-high" x="816" y="444" width="52" height="52" fill="#1E9668"/><text x="842" y="530" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="15" fill="#19211F">局域网下发</text><line x1="904" y1="470" x2="1014" y2="470" stroke="#1E9668" stroke-width="4"/><use data-icon="phosphor-duotone/speaker-high" x="1044" y="444" width="52" height="52" fill="#19211F"/><text x="1070" y="530" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="15" fill="#19211F">键盘解压播出</text></g>
<g id="pitfall"><rect x="238" y="584" width="804" height="60" rx="8" fill="#FFFFFF" stroke="#D65C4A" stroke-width="2"/><use data-icon="phosphor-duotone/warning-circle" x="262" y="600" width="28" height="28" fill="#D65C4A"/><text x="652" y="622" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#D65C4A">声音变调 = 采样率对不上：16 kHz 的录音按 48 kHz 播，就是快进加尖细。</text></g><g id="footer"><text x="64" y="690" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="12" fill="#5D6864">22 / 40</text></g></svg>
