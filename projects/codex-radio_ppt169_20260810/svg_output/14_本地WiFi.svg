<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><g id="background"><rect width="1280" height="720" fill="#F3F5F3"/></g><g id="statement"><text x="94" y="154" font-family="Arial Black, Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="50" font-weight="bold" fill="#19211F">第一版先把本地 Wi-Fi 跑通</text><text x="94" y="212" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="22" fill="#5D6864">键盘和 Mac 在同一个网络里，先把声音、状态和播放做扎实。</text></g><g id="lan"><circle cx="290" cy="420" r="82" fill="#19211F"/><use data-icon="phosphor-duotone/keyboard" x="250" y="380" width="80" height="80" fill="#F3F5F3"/><circle cx="640" cy="420" r="82" fill="#2D7D9A"/><use data-icon="phosphor-duotone/wifi-high" x="600" y="380" width="80" height="80" fill="#F3F5F3"/><circle cx="990" cy="420" r="82" fill="#1E9668"/><use data-icon="phosphor-duotone/desktop" x="950" y="380" width="80" height="80" fill="#F3F5F3"/><line x1="372" y1="420" x2="558" y2="420" stroke="#2D7D9A" stroke-width="6"/><line x1="722" y1="420" x2="908" y2="420" stroke="#1E9668" stroke-width="6"/><text x="290" y="548" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="18" fill="#19211F">键盘</text><text x="640" y="548" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="18" fill="#19211F">同一个局域网</text><text x="990" y="548" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="18" fill="#19211F">Mac Host</text></g><g id="boundary"><rect x="352" y="610" width="576" height="54" rx="8" fill="#FFFFFF" stroke="#D65C4A" stroke-width="2"/><text x="640" y="645" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#D65C4A">这里的“远程”是离开 Codex 窗口，不是已经完成公网遥控。</text></g><g id="footer"><text x="64" y="690" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="12" fill="#5D6864">14 / 47</text></g></svg>
