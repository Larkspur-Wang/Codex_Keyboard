<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><g id="background"><rect width="1280" height="720" fill="#F3F5F3"/></g><g id="header"><text x="64" y="82" font-family="Arial Black, Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="38" font-weight="bold" fill="#19211F">用人话认识这块硬件</text></g><g id="board"><image href="../images/easyinput-v2-assembled-front.png" x="300" y="140" width="680" height="382" preserveAspectRatio="xMidYMid meet"/></g>
<g id="cap-press"><use data-icon="phosphor-duotone/keyboard" x="76" y="160" width="44" height="44" fill="#1E9668"/><text x="132" y="190" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" fill="#19211F">能按</text><text x="132" y="220" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="15" fill="#5D6864">8 个机械键</text></g><g id="cap-turn"><use data-icon="phosphor-duotone/radio" x="76" y="288" width="44" height="44" fill="#2D7D9A"/><text x="132" y="318" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" fill="#19211F">能转</text><text x="132" y="348" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="15" fill="#5D6864">旋钮与按压</text></g><g id="cap-listen"><use data-icon="phosphor-duotone/microphone" x="1042" y="152" width="44" height="44" fill="#2D7D9A"/><text x="1098" y="182" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" fill="#19211F">能听</text><text x="1098" y="212" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="15" fill="#5D6864">I2S 麦克风</text></g><g id="cap-speak"><use data-icon="phosphor-duotone/speaker-high" x="1042" y="280" width="44" height="44" fill="#1E9668"/><text x="1098" y="310" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" fill="#19211F">能说</text><text x="1098" y="340" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="15" fill="#5D6864">功放与扬声器</text></g><g id="cap-light"><use data-icon="phosphor-duotone/lightbulb" x="1042" y="408" width="44" height="44" fill="#E0A636"/><text x="1098" y="438" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" fill="#19211F">能亮</text><text x="1098" y="468" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="15" fill="#5D6864">5 颗 WS2812</text></g><g id="summary"><rect x="238" y="568" width="804" height="72" rx="8" fill="#19211F"/><text x="640" y="614" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" fill="#F3F5F3">再加上 USB、蓝牙和 Wi-Fi，它就能和电脑一起工作。</text></g><g id="footer"><text x="64" y="674" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="12" fill="#5D6864">12 / 36</text></g></svg>
