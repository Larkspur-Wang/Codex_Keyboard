<g id="story"><text x="64" y="186" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="22" fill="#19211F"><tspan x="64" dy="0">一个在改固件</tspan><tspan x="64" dy="52">一个在做 Mac App</tspan><tspan x="64" dy="52">一个在跑测试</tspan><tspan x="64" dy="52">还有一个在整理课程</tspan></text><line x1="64" y1="410" x2="536" y2="410" stroke="#CBD2CE" stroke-width="2"/><text x="64" y="472" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="28" font-weight="bold" fill="#D65C4A">四个任务都能跑，</text><text x="64" y="514" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="28" font-weight="bold" fill="#19211F">但我一直在来回看。</text></g>
