<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><g id="background"><rect width="1280" height="720" fill="#F3F5F3"/></g><g id="image"><image href="../images/easyinput-default-keymap.png" x="602" y="0" width="678" height="720" preserveAspectRatio="xMidYMid slice"/><rect x="602" y="0" width="678" height="720" fill="#19211F" fill-opacity="0.12"/></g><g id="statement"><text x="64" y="170" font-family="Arial Black, Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="50" font-weight="bold" fill="#19211F"><tspan x="64" dy="0">EasyInput 不是一把</tspan><tspan x="64" dy="66">固定功能的键盘</tspan></text><line x1="64" y1="338" x2="504" y2="338" stroke="#1E9668" stroke-width="8"/><text x="64" y="420" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="28" font-weight="bold" fill="#1E9668">它的本质是一块 AI 硬件开发板。</text><text x="64" y="486" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="20" fill="#5D6864"><tspan x="64" dy="0">键位只是一个起点。</tspan><tspan x="64" dy="36">你可以重新定义它与电脑的关系。</tspan></text></g><g id="footer"><text x="64" y="674" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="12" fill="#5D6864">11 / 40</text></g></svg>
