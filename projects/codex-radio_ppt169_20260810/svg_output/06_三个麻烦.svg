<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<g id="background"><rect width="1280" height="720" fill="#F3F5F3"/></g><g id="header"><text x="64" y="84" font-family="Arial Black, Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="38" font-weight="bold" fill="#19211F">麻烦不是 AI 不够快，是我一直在打断自己</text></g>
<g id="problem-type"><rect x="64" y="160" width="352" height="410" rx="8" fill="#FFFFFF" stroke="#CBD2CE" stroke-width="2"/><use data-icon="phosphor-duotone/keyboard" x="96" y="200" width="56" height="56" fill="#2D7D9A"/><text x="96" y="314" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="28" font-weight="bold" fill="#19211F">总在打字</text><text x="96" y="370" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="20" fill="#5D6864"><tspan x="96" dy="0">很多要求只要说一句，</tspan><tspan x="96" dy="34">却要先坐回电脑前。</tspan></text></g>
<g id="problem-switch"><rect x="464" y="160" width="352" height="410" rx="8" fill="#FFFFFF" stroke="#CBD2CE" stroke-width="2"/><use data-icon="phosphor-duotone/desktop" x="496" y="200" width="56" height="56" fill="#D65C4A"/><text x="496" y="314" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="28" font-weight="bold" fill="#19211F">总在切窗口</text><text x="496" y="370" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="20" fill="#5D6864"><tspan x="496" dy="0">看谁做完了，</tspan><tspan x="496" dy="34">看谁还在等我。</tspan></text></g>
<g id="problem-wait"><rect x="864" y="160" width="352" height="410" rx="8" fill="#FFFFFF" stroke="#CBD2CE" stroke-width="2"/><use data-icon="phosphor-duotone/timer" x="896" y="200" width="56" height="56" fill="#E0A636"/><text x="896" y="314" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="28" font-weight="bold" fill="#19211F">总在等结果</text><text x="896" y="370" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="20" fill="#5D6864"><tspan x="896" dy="0">盯着进度，</tspan><tspan x="896" dy="34">反而没去做别的事。</tspan></text></g>
<g id="footer"><text x="64" y="674" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="12" fill="#5D6864">06 / 40</text></g></svg>
