<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><g id="background"><rect width="1280" height="720" fill="#F3F5F3"/></g><g id="header"><text x="64" y="78" font-family="Arial Black, Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="38" font-weight="bold" fill="#19211F">附录：密钥、缓存和数据放在哪里</text></g><g id="key"><rect x="64" y="150" width="352" height="410" rx="8" fill="#19211F"/><use data-icon="phosphor-duotone/lock-key" x="96" y="190" width="56" height="56" fill="#E0A636"/><text x="96" y="298" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="26" font-weight="bold" fill="#F3F5F3">API Key</text><text x="96" y="354" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="19" fill="#CBD2CE"><tspan x="96" dy="0">只在 Mac 本地 `.env`</tspan><tspan x="96" dy="38">文件权限 0600</tspan><tspan x="96" dy="38">绝不提交 Git</tspan></text></g><g id="cache"><rect x="464" y="150" width="352" height="410" rx="8" fill="#FFFFFF" stroke="#CBD2CE" stroke-width="2"/><use data-icon="phosphor-duotone/database" x="496" y="190" width="56" height="56" fill="#2D7D9A"/><text x="496" y="298" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="26" font-weight="bold" fill="#19211F">摘要与音频</text><text x="496" y="354" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="19" fill="#5D6864"><tspan x="496" dy="0">Host 管理 SQLite</tspan><tspan x="496" dy="38">音频加密缓存到 Mac</tspan><tspan x="496" dy="38">听完后精确删除</tspan></text></g><g id="device"><rect x="864" y="150" width="352" height="410" rx="8" fill="#1E9668"/><use data-icon="phosphor-duotone/shield-check" x="896" y="190" width="56" height="56" fill="#F3F5F3"/><text x="896" y="298" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="26" font-weight="bold" fill="#F3F5F3">键盘设备</text><text x="896" y="354" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="19" fill="#F3F5F3"><tspan x="896" dy="0">只保存 Wi-Fi 与 Host 配置</tspan><tspan x="896" dy="38">运行时只认槽位号</tspan><tspan x="896" dy="38">不保存 Codex 对话</tspan></text></g><g id="note"><text x="64" y="624" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="20" fill="#D65C4A">公开仓库只包含代码、文档和脱敏截图，不包含任何真实任务 ID 或密钥。</text></g><g id="footer"><text x="64" y="674" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="12" fill="#5D6864">46 / 47</text></g></svg>
