<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F3F5F3"/>
  <g id="content" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" fill="#19211F">
    <text x="64" y="54" font-size="15" fill="#1E9668">原理 4 / 10 · 数字音频</text>
    <text x="64" y="108" font-size="38" font-weight="bold">录音和播报，用两套音频参数</text>
    <text x="64" y="152" font-size="22" fill="#5D6864">PCM16 是采样数据。采样率、位深和声道数要一起核对。</text>
    <text x="64" y="239" font-size="28" font-weight="bold" fill="#2D7D9A">上行：你说话</text>
    <text x="64" y="281" font-size="22">16 kHz · 单声道 · PCM16</text>
    <use data-icon="phosphor-duotone/microphone" x="438" y="216" width="64" height="64" fill="#2D7D9A"/>
    <text x="430" y="322" font-size="22">I2S 采集</text>
    <path d="M532 249 H674 M754 249 H922" stroke="#2D7D9A" stroke-width="3"/>
    <use data-icon="phosphor-duotone/shield-check" x="688" y="216" width="64" height="64" fill="#2D7D9A"/>
    <text x="636" y="322" font-size="22">PCM 分帧 + HMAC</text>
    <use data-icon="phosphor-duotone/desktop" x="947" y="216" width="64" height="64" fill="#2D7D9A"/>
    <text x="913" y="322" font-size="22">Mac 调云端 ASR</text>
    <path d="M64 367 H1216" stroke="#CBD2CE" stroke-width="2"/>
    <text x="64" y="452" font-size="28" font-weight="bold" fill="#1E9668">下行：听总结</text>
    <text x="64" y="494" font-size="22">48 kHz · 单声道</text>
    <use data-icon="phosphor-duotone/cloud-arrow-up" x="438" y="429" width="64" height="64" fill="#1E9668"/>
    <text x="405" y="535" font-size="22">TTS 生成 WAV</text>
    <path d="M532 462 H674 M754 462 H922" stroke="#1E9668" stroke-width="3"/>
    <use data-icon="phosphor-duotone/lock-key" x="688" y="429" width="64" height="64" fill="#1E9668"/>
    <text x="629" y="535" font-size="22">ADPCM 编码并加密</text>
    <use data-icon="phosphor-duotone/speaker-high" x="947" y="429" width="64" height="64" fill="#1E9668"/>
    <text x="913" y="535" font-size="22">键盘解码播放</text>
    <text x="64" y="620" font-size="22" fill="#5D6864">HMAC 校验上行来源和完整性，不隐藏 PCM 内容。声音变调时，先核对采样率。</text>
    <text x="64" y="690" font-size="12" fill="#5D6864">25 / 47</text>
  </g>
</svg>
