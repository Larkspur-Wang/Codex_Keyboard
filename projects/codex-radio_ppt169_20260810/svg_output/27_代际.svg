<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#F3F5F3"/>
  <g id="content" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" fill="#19211F">
    <text x="64" y="54" font-size="15" fill="#1E9668">原理 6 / 10 · 版本与播放身份</text>
    <text x="64" y="108" font-size="38" font-weight="bold">重新连接，不会自动删掉未听内容</text>
    <text x="64" y="152" font-size="22" fill="#5D6864">摘要版本回答“哪段内容”，播放租约回答“哪一次播放”。</text>
    <text x="76" y="240" font-size="24" font-weight="bold">示例</text>
    <text x="274" y="240" font-size="22" fill="#5D6864">摘要版本</text>
    <text x="527" y="240" font-size="22" fill="#5D6864">播放身份</text>
    <text x="790" y="240" font-size="22" fill="#5D6864">Host 如何处理</text>
    <path d="M64 264 H1216 M64 350 H1216 M64 436 H1216 M64 522 H1216" stroke="#CBD2CE" stroke-width="2"/>
    <g font-size="24">
      <text x="76" y="317">第一次播放</text>
      <text x="309" y="317">7</text>
      <text x="575" y="317">A</text>
      <text x="790" y="317">未播完，仍为未听</text>
      <text x="76" y="403">断电后重连</text>
      <text x="309" y="403">7</text>
      <text x="575" y="403">B</text>
      <text x="790" y="403">同一内容，重新请求</text>
      <text x="76" y="489">A 的迟到回执</text>
      <text x="309" y="489">7</text>
      <text x="575" y="489">A</text>
      <text x="790" y="489" fill="#D65C4A">不能算作 B 已听完</text>
      <text x="76" y="575">B 完整播放</text>
      <text x="309" y="575">7</text>
      <text x="575" y="575">B</text>
      <text x="790" y="575" fill="#1E9668">身份匹配，标记已听</text>
    </g>
    <text x="64" y="638" font-size="22" fill="#5D6864">新摘要完整发布后才替换旧版。这里的 A/B 是教学示例，实际还会核对连接编号和租约。</text>
    <text x="64" y="690" font-size="12" fill="#5D6864">27 / 47</text>
  </g>
</svg>
