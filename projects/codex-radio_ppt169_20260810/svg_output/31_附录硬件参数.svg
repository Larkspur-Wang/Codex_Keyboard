<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><g id="background"><rect width="1280" height="720" fill="#F3F5F3"/></g><g id="header"><text x="64" y="78" font-family="Arial Black, Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="38" font-weight="bold" fill="#19211F">附录：EasyInput V2 公开硬件参数</text></g><g id="photo"><image href="../images/easyinput-v2-pcb-back.png" x="64" y="132" width="590" height="332" preserveAspectRatio="xMidYMid meet"/><text x="64" y="494" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="15" fill="#5D6864">EasyInput V2 PCB 背面</text></g><g id="specs"><rect x="704" y="132" width="512" height="472" rx="8" fill="#FFFFFF" stroke="#CBD2CE" stroke-width="2"/><text x="740" y="186" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2D7D9A">ESP32-S3R8</text><text x="740" y="228" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="20" fill="#19211F">8 MB PSRAM · 16 MB Flash</text><line x1="740" y1="254" x2="1178" y2="254" stroke="#CBD2CE" stroke-width="2"/><text x="740" y="300" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="20" fill="#19211F"><tspan x="740" dy="0">输入：8 键 + 旋钮按压</tspan><tspan x="740" dy="38">灯光：5 颗 WS2812</tspan><tspan x="740" dy="38">音频：I2S 麦克风 + 数字功放</tspan><tspan x="740" dy="38">连接：USB-C、BLE、2.4 GHz Wi-Fi</tspan><tspan x="740" dy="38">调试：BOOT 入口、UART 触点</tspan></text><rect x="740" y="520" width="438" height="54" rx="8" fill="#19211F"/><text x="959" y="554" text-anchor="middle" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="16" fill="#F3F5F3">PSRAM 与扬声器由本案例自定义固件真正启用</text></g><g id="footer"><text x="64" y="674" font-family="Arial, Arial Unicode MS, Microsoft YaHei, sans-serif" font-size="12" fill="#5D6864">31 / 36</text></g></svg>
