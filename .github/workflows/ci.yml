name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Toolchains
        run: |
          rustup toolchain install 1.94.1 --profile minimal --component clippy,rustfmt
          rustup default 1.94.1
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fast eval
        run: ./scripts/eval-fast.sh

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: ESP-IDF build
        shell: bash
        run: |
          export IDF_PATH="${IDF_PATH:-/opt/esp/idf}"
          source "$IDF_PATH/export.sh"
          idf.py -C firmware -B "$GITHUB_WORKSPACE/firmware/build-ci" build

  macos-desktop:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Toolchains and dependencies
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          rustup default 1.94.1
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          pnpm install --frozen-lockfile
      - name: Build unsigned macOS desktop bundle
        run: pnpm --filter @easy-codex/desktop-ui bundle:mac
