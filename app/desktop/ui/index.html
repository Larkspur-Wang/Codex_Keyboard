<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Codex Keyboard</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="titlebar">
        <div>
          <p class="eyebrow">MAC HOST</p>
          <h1>Codex Keyboard</h1>
        </div>
        <button
          id="refresh"
          class="icon-button"
          type="button"
          aria-label="刷新 Host 状态"
          title="刷新"
        >
          <svg
            aria-hidden="true"
            data-icon-source="lucide:refresh-cw"
            viewBox="0 0 24 24"
            width="18"
            height="18"
          >
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
            <path d="M21 3v5h-5" />
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
            <path d="M8 16H3v5" />
          </svg>
        </button>
      </header>

      <section id="status-band" class="status-band checking" aria-live="polite">
        <span id="status-dot" class="status-dot checking"></span>
        <div>
          <p id="status-title" class="status-title">正在连接 Host</p>
          <p id="status-detail" class="status-detail">等待本地 health socket</p>
        </div>
      </section>

      <dl class="facts">
        <div class="fact-row">
          <dt>Host 版本</dt>
          <dd id="host-version">--</dd>
        </div>
        <div class="fact-row">
          <dt>进程</dt>
          <dd id="host-pid">--</dd>
        </div>
        <div class="fact-row">
          <dt>Health socket</dt>
          <dd id="host-socket">run/host.sock</dd>
        </div>
        <div class="fact-row">
          <dt>数据库 migration</dt>
          <dd id="database-schema">--</dd>
        </div>
      </dl>

      <footer>
        <span id="last-updated">尚未收到状态</span>
        <span>关闭窗口不会停止 Host</span>
      </footer>
    </main>
  </body>
</html>
